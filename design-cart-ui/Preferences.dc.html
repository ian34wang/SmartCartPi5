<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 720px; height: 1280px;
      font-family: 'Kalam', 'Comic Sans MS', cursive;
      background: #fdfcf9; color: #1a1a1a;
      border: 3px solid #1a1a1a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .statusbar { display:flex; align-items:center; justify-content:space-between; padding:20px 26px; border-bottom:2px dashed #1a1a1a; font-size:20px; font-weight:700; }
    .skip { border:2px dashed #1a1a1a; border-radius:6px; padding:8px 16px; font-size:15px; font-family:inherit; background:#fff; font-weight:400; }
    .section { padding:24px 26px; border-bottom:2px dashed #1a1a1a; }
    .section-title { font-size:23px; font-weight:700; margin:0 0 4px; }
    .section-sub { font-size:14px; color:#777; margin:0 0 16px; }
    .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
    .opt { border:2.5px solid #1a1a1a; border-radius:8px; padding:16px 10px; font-size:19px; font-family:inherit; background:#fff; text-align:center; }
    .opt-selected { background:#1a1a1a; color:#fff; }
    .custom-row { margin-top:14px; display:flex; align-items:center; gap:10px; font-size:17px; }
    .custom-input { flex:1; border:2px dashed #1a1a1a; border-radius:6px; padding:12px; text-align:center; }
    .footer-cta { margin-top:auto; padding:22px 26px; border-top:2px dashed #1a1a1a; }
    .btn-primary { width:100%; border:3px solid #1a1a1a; border-radius:10px; padding:22px; font-size:24px; font-family:inherit; background:#1a1a1a; color:#fff; }
  </style>
</helmet>
<div class="statusbar">
  <span>快速設定偏好</span>
  <button class="skip">跳過，直接購物</button>
</div>

<div class="section">
  <div class="section-title">錢包管家 → 預算上限</div>
  <div class="section-sub">購物中會即時顯示消費進度；超過上限不會鎖卡，僅提醒（進階分析見購物中提示）</div>
  <div class="grid2">
    <button class="opt">$500</button>
    <button class="opt opt-selected">$1000</button>
    <button class="opt">$1500</button>
    <button class="opt">自由消費（不限）</button>
  </div>
  <div class="custom-row">
    <span>或自訂金額</span>
    <div class="custom-input">$ ____</div>
  </div>
</div>

<div class="section">
  <div class="section-title">健康護照 → 飲食禁忌與過敏原</div>
  <div class="section-sub">購物中若辨識到相關成分會即時提醒</div>
  <div class="grid2">
    <button class="opt">三高守門（低鈉／低脂）</button>
    <button class="opt opt-selected">堅果過敏</button>
    <button class="opt">乳糖不耐</button>
    <button class="opt">海鮮過敏</button>
  </div>
</div>

<div class="footer-cta">
  <button class="btn-primary">儲存偏好，開始購物 →</button>
</div>
</x-dc>
</body>
</html>
