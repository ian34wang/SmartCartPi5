<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>④ 偏好設定 1/3：過敏原</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 720px; height: 1280px;
      font-family: 'Kalam', 'Comic Sans MS', cursive;
      background: #fdfcf9; color: #1a1a1a;
      border: 3px solid #1a1a1a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sysbar { display:flex; align-items:center; justify-content:space-between; padding:10px 22px; font-size:16px; color:#555; border-bottom:1px solid #bbb; background:#f2f1ec; }
    .sysbar .row { display:flex; align-items:center; gap:8px; }

    .wizard-head { padding:18px 22px 14px; border-bottom:2px dashed #1a1a1a; }
    .wizard-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .wizard-title { font-size:26px; font-weight:700; }
    .skip-link { font-size:17px; color:#777; border:1.5px dashed #999; border-radius:6px; padding:6px 12px; }
    .steps { display:flex; gap:8px; }
    .step-dot { flex:1; height:6px; border-radius:3px; background:#ddd; }
    .step-dot.done { background:#1a1a1a; }
    .step-label { font-size:16px; color:#777; margin-top:6px; }

    .content { flex:1; min-height:0; padding:20px 22px; overflow:auto; }
    .content-sub { font-size:17px; color:#777; margin-bottom:14px; }
    .chip-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; }
    .chip { border:2.5px solid #1a1a1a; border-radius:12px; padding:30px 10px; font-size:26px; text-align:center; display:flex; align-items:center; justify-content:center; gap:10px; }
    .chip .box { width:24px; height:24px; border:2px solid #1a1a1a; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .chip.selected { background:#1a1a1a; color:#fff; }
    .chip.selected .box { border-color:#fff; }

    .footer-cta { padding:18px 22px; border-top:2px dashed #1a1a1a; display:flex; gap:12px; }
    .btn { flex:1; border:2.5px solid #1a1a1a; border-radius:10px; padding:16px; font-size:22px; font-family:inherit; text-align:center; }
    .btn-primary { background:#1a1a1a; color:#fff; }
  </style>
</head>
<body>
<div class="sysbar">
  <div class="row">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"><path d="M2 8.5c5.5-5 14.5-5 20 0"/><path d="M5.5 12.5c3.6-3.2 9.4-3.2 13 0"/><path d="M9 16.5c1.9-1.6 4.1-1.6 6 0"/><circle cx="12" cy="20" r="1.2" fill="#555"/></svg>
    <span>Wi-Fi 連線正常</span>
  </div>
  <div class="row"><span>10:25 AM</span><span>🔋 100%</span></div>
</div>

<div class="wizard-head">
  <div class="wizard-top">
    <div class="wizard-title">過敏原設定</div>
    <div class="skip-link">跳過此步驟</div>
  </div>
  <div class="steps">
    <div class="step-dot done"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
  </div>
  <div class="step-label">步驟 1 / 3　·　依衛福部公告 11 項強制標示過敏原，可複選</div>
</div>

<div class="content">
  <div class="content-sub">購物中辨識到含有以下成分的商品時，會即時提醒你</div>
  <div class="chip-grid">
    <div class="chip selected"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>堅果類</div>
    <div class="chip"><span class="box"></span>甲殼類</div>
    <div class="chip"><span class="box"></span>芒果</div>
    <div class="chip"><span class="box"></span>花生</div>
    <div class="chip"><span class="box"></span>牛奶／羊奶</div>
    <div class="chip"><span class="box"></span>蛋</div>
    <div class="chip"><span class="box"></span>芝麻</div>
    <div class="chip"><span class="box"></span>含麩質穀物</div>
    <div class="chip"><span class="box"></span>大豆</div>
    <div class="chip"><span class="box"></span>魚類</div>
    <div class="chip"><span class="box"></span>亞硫酸鹽</div>
    <div class="chip"><span class="box"></span>都沒有</div>
  </div>
</div>

<div class="footer-cta">
  <div class="btn">上一步</div>
  <div class="btn btn-primary">下一步：葷素習慣 →</div>
</div>

<style>
  #__preview_nav {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 6px; box-sizing: border-box; z-index: 999999;
    pointer-events: none;
  }
  #__preview_nav button {
    pointer-events: auto;
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(26,26,26,0.35);
    background: rgba(253,252,249,0.55);
    color: rgba(26,26,26,0.55);
    font-size: 16px; font-family: sans-serif; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #__preview_nav button:active { background: rgba(26,26,26,0.15); }
  #__preview_nav .label {
    pointer-events: auto;
    font-size: 10px; font-family: sans-serif; color: rgba(26,26,26,0.45);
    background: rgba(253,252,249,0.55); border-radius: 8px;
    padding: 3px 8px; max-width: 55%; text-align: center;
  }
</style>
<div id="__preview_nav">
  <button onclick="window.pywebview && window.pywebview.api.go(-1)">‹</button>
  <div class="label">④ 偏好設定 1/3：過敏原（4/13，點兩側圓鈕切換畫面）</div>
  <button onclick="window.pywebview && window.pywebview.api.go(1)">›</button>
</div>

</body>
</html>
