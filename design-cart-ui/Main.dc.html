<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 720px; height: 1280px;
      font-family: 'Kalam', 'Comic Sans MS', cursive;
      background: #fdfcf9; color: #1a1a1a;
      border: 3px solid #1a1a1a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sysbar { display:flex; align-items:center; justify-content:space-between; padding:10px 22px; font-size:16px; color:#555; border-bottom:1px solid #bbb; background:#f2f1ec; }
    .sysbar .row { display:flex; align-items:center; gap:8px; }
    .center-stage { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; padding:0 48px; text-align:center; }
    .title { font-size:48px; font-weight:700; line-height:1.3; margin:0; }
    .hint-row { display:flex; align-items:center; gap:14px; color:#555; font-size:22px; border-top:2px dashed #1a1a1a; border-bottom:2px dashed #1a1a1a; padding:22px 0; width:100%; justify-content:center; }
    .btn-big { border:3px solid #1a1a1a; border-radius:10px; padding:28px 56px; font-size:32px; font-family:inherit; background:#1a1a1a; color:#fff; cursor:pointer; }
    .footer { padding:18px 26px; border-top:2px dashed #1a1a1a; font-size:19px; color:#555; text-align:center; }
  </style>
</helmet>
<div class="sysbar">
  <div class="row">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"><path d="M2 8.5c5.5-5 14.5-5 20 0"/><path d="M5.5 12.5c3.6-3.2 9.4-3.2 13 0"/><path d="M9 16.5c1.9-1.6 4.1-1.6 6 0"/><circle cx="12" cy="20" r="1.2" fill="#555"/></svg>
    <span>Wi-Fi 連線正常</span>
  </div>
  <div class="row">
    <span>10:25 AM</span>
    <svg width="26" height="14" viewBox="0 0 30 16"><rect x="1" y="1" width="25" height="14" rx="3" fill="none" stroke="#555" stroke-width="2"/><rect x="27" y="5" width="2.5" height="6" rx="1" fill="#555"/><rect x="3.5" y="3.5" width="20" height="9" fill="#555"/></svg>
    <span>100%</span>
  </div>
</div>

<div class="center-stage">
  <h1 class="title">開始使用<br>AI 智慧購物車</h1>
  <div class="hint-row">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="7" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="11" stroke-dasharray="2 4"/></svg>
    <span>靠近感應區自動喚醒</span>
  </div>
  <button class="btn-big">點擊開始使用 →</button>
</div>

<div class="footer">系統狀態：正常運作</div>
</x-dc>
</body>
</html>
