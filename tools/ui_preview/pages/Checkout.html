<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>⑫ 自助結帳</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 720px; height: 1280px;
      font-family: 'Kalam', 'Comic Sans MS', cursive;
      background: #fdfcf9; color: #1a1a1a;
      border: 3px solid #1a1a1a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sysbar { display:flex; align-items:center; justify-content:space-between; padding:8px 22px; font-size:16px; color:#555; border-bottom:1px solid #bbb; background:#f2f1ec; }
    .sysbar .row { display:flex; align-items:center; gap:8px; }

    .statusbar { display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:2px dashed #1a1a1a; font-size:26px; font-weight:700; }
    .back-link { font-size:16px; font-weight:400; color:#777; padding:4px 22px 0; }
    .back-btn { border:2px dashed #1a1a1a; border-radius:6px; padding:10px 16px; font-size:21px; font-family:inherit; background:#fff; font-weight:400; }

    .section { padding:16px 22px; border-bottom:2px dashed #1a1a1a; }
    .section-title { display:flex; align-items:center; gap:8px; font-size:26px; font-weight:700; margin-bottom:12px; }
    .lock-badge { font-size:15px; border:1.5px solid #1a1a1a; border-radius:10px; padding:2px 10px; font-weight:400; }

    .item-row { display:flex; justify-content:space-between; font-size:19px; padding:7px 0; border-bottom:1px dashed #ddd; }
    .item-row:last-of-type { border-bottom:none; }
    .totals { margin-top:12px; font-size:19px; line-height:1.8; border-top:2px dashed #1a1a1a; padding-top:10px; }
    .totals .final { font-weight:700; font-size:24px; }
    .invoice { margin-top:6px; font-size:16px; color:#777; }

    .pay-methods { display:flex; gap:12px; margin-bottom:12px; }
    .pay-btn { flex:1; border:2.5px solid #1a1a1a; border-radius:8px; padding:16px; text-align:center; font-size:23px; }
    .pay-btn.selected { background:#1a1a1a; color:#fff; }
    .qr-hint { font-size:16px; color:#555; margin-bottom:8px; }
    .qr-box { width:150px; height:150px; margin:0 auto; border:2.5px solid #1a1a1a; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; color:#666; }

    .footer-cta { padding:16px 22px; border-top:2px dashed #1a1a1a; }
    .btn-primary { width:100%; border:3px solid #1a1a1a; border-radius:10px; padding:22px; font-size:28px; font-family:inherit; background:#1a1a1a; color:#fff; }

    .bottomnav { display:flex; border-top:2px dashed #1a1a1a; background:#fdfcf9; }
    .navitem { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 11px; font-size:18px; color:#777; }
    .navitem svg { stroke:#777; }
    .navitem.active { color:#1a1a1a; font-weight:700; }
    .navitem.active svg { stroke:#1a1a1a; }
  </style>
</head>
<body>
<div class="sysbar">
  <div class="row">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"><path d="M2 8.5c5.5-5 14.5-5 20 0"/><path d="M5.5 12.5c3.6-3.2 9.4-3.2 13 0"/><path d="M9 16.5c1.9-1.6 4.1-1.6 6 0"/><circle cx="12" cy="20" r="1.2" fill="#555"/></svg>
    <span>Wi-Fi 連線正常</span>
  </div>
  <div class="row"><span>10:25 AM</span><span>🔋 90%</span></div>
</div>

<div class="statusbar">
  <span>購物車自助結帳</span>
  <button class="back-btn">✕ 返回繼續選購</button>
</div>
<div class="back-link">（返回將解除清單鎖定，可能需重新核對重量）</div>

<div class="section">
  <div class="section-title">
    消費明細核對
    <span class="lock-badge">🔒 清單已鎖定</span>
  </div>
  <div class="item-row"><span>1. 全脂鮮奶 936ml</span><span>$85</span></div>
  <div class="item-row"><span>2. 即期有機生菜（惜食 5折）</span><span>$45</span></div>
  <div class="totals">
    <div>商品小計 = $400</div>
    <div>惜食／促銷 = −$20</div>
    <div class="final">應付金額 = $380（已為您省 $20）</div>
    <div class="invoice">雲端發票載具：1AB1235</div>
  </div>
</div>

<div class="section" style="flex:1; min-height:0; overflow:auto;">
  <div class="section-title">選擇付款方式</div>
  <div class="pay-methods">
    <div class="pay-btn selected">LINE Pay</div>
    <div class="pay-btn">信用卡支付</div>
  </div>
  <div class="qr-hint">請使用手機掃描 QR Code 完成扣款</div>
  <div class="qr-box">QR Code</div>
</div>

<div class="footer-cta">
  <button class="btn-primary">確認付款，推車直接離場</button>
</div>

<div class="bottomnav">
  <div class="navitem">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    清單
  </div>
  <div class="navitem">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
    找貨
  </div>
  <div class="navitem">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 12 22 2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><circle cx="7" cy="7" r="1.4" fill="currentColor" stroke="none"/></svg>
    優惠
  </div>
  <div class="navitem">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    我的
  </div>
  <div class="navitem active">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/></svg>
    結帳
  </div>
</div>

<style>
  #__preview_nav {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 6px; box-sizing: border-box; z-index: 999999;
    pointer-events: none;
  }
  #__preview_nav button {
    pointer-events: auto;
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(26,26,26,0.35);
    background: rgba(253,252,249,0.55);
    color: rgba(26,26,26,0.55);
    font-size: 16px; font-family: sans-serif; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #__preview_nav button:active { background: rgba(26,26,26,0.15); }
  #__preview_nav .label {
    pointer-events: auto;
    font-size: 10px; font-family: sans-serif; color: rgba(26,26,26,0.45);
    background: rgba(253,252,249,0.55); border-radius: 8px;
    padding: 3px 8px; max-width: 55%; text-align: center;
  }
</style>
<div id="__preview_nav">
  <button onclick="window.pywebview && window.pywebview.api.go(-1)">‹</button>
  <div class="label">⑫ 自助結帳（12/13，點兩側圓鈕切換畫面）</div>
  <button onclick="window.pywebview && window.pywebview.api.go(1)">›</button>
</div>

</body>
</html>
