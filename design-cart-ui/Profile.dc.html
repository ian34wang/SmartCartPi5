<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 720px; height: 1280px;
      font-family: 'Kalam', 'Comic Sans MS', cursive;
      background: #fdfcf9; color: #1a1a1a;
      border: 3px solid #1a1a1a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sysbar { display:flex; align-items:center; justify-content:space-between; padding:8px 22px; font-size:16px; color:#555; border-bottom:1px solid #bbb; background:#f2f1ec; }
    .sysbar .row { display:flex; align-items:center; gap:8px; }

    .statusbar { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:2px dashed #1a1a1a; font-size:24px; font-weight:700; }
    .member-tag { font-size:16px; font-weight:400; border:1.5px solid #1a1a1a; border-radius:12px; padding:3px 12px; }

    .scroll-body { flex:1; min-height:0; overflow:auto; }
    .section { padding:16px 22px; border-bottom:2px dashed #1a1a1a; }
    .section-title { font-size:25px; font-weight:700; margin:0 0 4px; }
    .section-sub { font-size:15px; color:#777; margin:0 0 12px; }

    .member-line { font-size:21px; }
    .guest-note { font-size:16px; color:#777; margin-top:6px; }

    .grid4 { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; }
    .opt { border:2.5px solid #1a1a1a; border-radius:8px; padding:12px 6px; font-size:19px; text-align:center; background:#fff; }
    .opt-selected { background:#1a1a1a; color:#fff; }
    .custom-row { margin-top:12px; display:flex; align-items:center; gap:10px; font-size:17px; }
    .custom-input { flex:1; border:2px dashed #1a1a1a; border-radius:6px; padding:10px; text-align:center; }
    .btn-small { border:2px solid #1a1a1a; border-radius:6px; padding:10px 18px; font-size:17px; background:#fff; }

    .pref-row { display:flex; justify-content:space-between; gap:16px; padding:8px 0; font-size:19px; border-bottom:1px dashed #ddd; }
    .pref-row:last-child { border-bottom:none; }
    .pref-key { color:#555; white-space:nowrap; }
    .pref-val { text-align:right; }
    .btn-outline { width:100%; margin-top:12px; border:2.5px solid #1a1a1a; border-radius:8px; padding:12px; font-size:20px; background:#fff; }

    .tx-row { display:flex; justify-content:space-between; padding:9px 0; font-size:19px; border-bottom:1px dashed #ddd; }
    .tx-row:last-child { border-bottom:none; }
    .tx-meta { color:#777; font-size:16px; }

    .bottomnav { display:flex; border-top:2px dashed #1a1a1a; background:#fdfcf9; }
    .navitem { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 2px 12px; font-size:18px; color:#777; }
    .navitem svg { stroke:#777; }
    .navitem.active { color:#1a1a1a; font-weight:700; }
    .navitem.active svg { stroke:#1a1a1a; }
  </style>
</helmet>

<div class="sysbar">
  <div class="row">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"><path d="M2 8.5c5.5-5 14.5-5 20 0"/><path d="M5.5 12.5c3.6-3.2 9.4-3.2 13 0"/><path d="M9 16.5c1.9-1.6 4.1-1.6 6 0"/><circle cx="12" cy="20" r="1.2" fill="#555"/></svg>

</div>

<div class="statusbar">
  <span>我的</span>
  <span class="member-tag">會員</span>
</div>

<div class="scroll-body">

  <div class="section">

    <div class="grid4">

      <div class="pref-row"><span class="pref-key">過敏原</span><span class="pref-val">花生、芝麻</span></div>

    </div>
    <div class="btn-outline">重新設定偏好 →</div>
  </div>

  <div class="section">
    <div class="section-title">最近消費紀錄</div>
    <div class="tx-list">
      <div class="tx-row"><span>10/27 18:42　<span class="tx-meta">3 件・LINE Pay</span></span><span>$95</span></div>
      <div class="tx-row"><span>10/25 12:10　<span class="tx-meta">1 件・信用卡支付</span></span><span>$25</span></div>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
