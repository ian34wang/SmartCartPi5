<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>⑨ 導航尋物</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 720px; height: 1280px;
      font-family: 'Kalam', 'Comic Sans MS', cursive;
      background: #fdfcf9; color: #1a1a1a;
      border: 3px solid #1a1a1a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sysbar { display:flex; align-items:center; justify-content:space-between; padding:8px 22px; font-size:16px; color:#555; border-bottom:1px solid #bbb; background:#f2f1ec; }
    .sysbar .row { display:flex; align-items:center; gap:8px; }

    .searchbar { display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:2px dashed #1a1a1a; gap:12px; }
    .search-input { flex:1; display:flex; align-items:center; gap:10px; border:2px solid #1a1a1a; border-radius:20px; padding:10px 16px; font-size:20px; color:#777; }
    .close-btn { border:2px dashed #1a1a1a; border-radius:6px; padding:10px 16px; font-size:22px; font-family:inherit; background:#fff; }

    .section { padding:18px 22px; border-bottom:2px dashed #1a1a1a; }
    .section-title { font-size:27px; font-weight:700; margin:0 0 12px; }
    .nav-line { font-size:19px; margin:6px 0; }
    .nav-instruction { font-size:30px; font-weight:700; margin:12px 0; line-height:1.3; }
    .muted { color:#777; font-size:17px; }
    .replan-btn { margin-top:12px; border:2px dashed #1a1a1a; border-radius:8px; padding:16px; font-size:24px; font-family:inherit; background:#fff; width:100%; }

    .map-wrap { flex:1; min-height:0; padding:18px 22px; display:flex; flex-direction:column; overflow:hidden; }
    .map-box { flex:1; border:2.5px solid #1a1a1a; border-radius:10px; position:relative; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr auto; }
    .zone { border:1.5px dashed #999; display:flex; align-items:center; justify-content:center; font-size:18px; color:#555; }
    .path-line { position:absolute; top:14%; left:12%; width:60%; height:46%; border-left:3px dashed #1a1a1a; border-bottom:3px dashed #1a1a1a; }
    .cur-pos { position:absolute; top:10%; left:10%; width:12px; height:12px; border-radius:50%; background:#1a1a1a; }
    .target-pos { position:absolute; top:58%; left:70%; display:flex; align-items:center; gap:4px; font-size:16px; font-weight:700; }

    .bottomnav { display:flex; border-top:2px dashed #1a1a1a; background:#fdfcf9; }
    .navitem { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 2px 12px; font-size:18px; color:#777; }
    .navitem svg { stroke:#777; }
    .navitem.active { color:#1a1a1a; font-weight:700; }
    .navitem.active svg { stroke:#1a1a1a; }
    .nav-badge { position:relative; }
    .nav-dot { position:absolute; top:-2px; right:-4px; width:8px; height:8px; border-radius:50%; background:#1a1a1a; }
  </style>
</head>
<body>
<div class="sysbar">
  <div class="row">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"><path d="M2 8.5c5.5-5 14.5-5 20 0"/><path d="M5.5 12.5c3.6-3.2 9.4-3.2 13 0"/><path d="M9 16.5c1.9-1.6 4.1-1.6 6 0"/><circle cx="12" cy="20" r="1.2" fill="#555"/></svg>
    <span>Wi-Fi 連線正常</span>
  </div>
  <div class="row"><span>10:25 AM</span><span>🔋 90%</span></div>
</div>

<div class="searchbar">
  <div class="search-input">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <span>點擊搜尋商品名稱或類別</span>
  </div>
  <button class="close-btn">✕ 關閉導航</button>
</div>

<div class="section">
  <div class="section-title">目前導航路徑指引</div>
  <div class="nav-line">目標商品 → 大同純釀醬油 500ml</div>
  <div class="nav-line">商品位置 → 走道 B2 貨架架位 04</div>
  <div class="nav-instruction">前方走道右轉 → 直行 8 公尺 → 左轉即達目標貨架</div>
  <div class="muted">預估步行約 20 秒（已避開擁擠走道）</div>
  <button class="replan-btn">⟳ 重新規劃路線</button>
</div>

<div class="map-wrap">
  <div class="section-title" style="padding-bottom:8px;">賣場平面圖（最短路徑）</div>
  <div class="map-box">
    <div class="zone" style="grid-column:1;grid-row:1;">貨架 A</div>
    <div class="zone" style="grid-column:2;grid-row:1;">貨架 B</div>
    <div class="zone" style="grid-column:1;grid-row:2;">生鮮區</div>
    <div class="zone" style="grid-column:2;grid-row:2;">收銀台</div>
    <div class="zone" style="grid-column:1/3;grid-row:3;">入口　　　　　　　　　出口</div>
    <div class="path-line"></div>
    <div class="cur-pos"></div>
    <div class="target-pos">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      目標貨架
    </div>
  </div>
</div>

<div class="bottomnav">
  <div class="navitem">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    清單
  </div>
  <div class="navitem active">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
    找貨
  </div>
  <div class="navitem nav-badge">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 12 22 2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/><circle cx="7" cy="7" r="1.4" fill="currentColor" stroke="none"/></svg>
    優惠
    <span class="nav-dot"></span>
  </div>
  <div class="navitem">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    我的
  </div>
  <div class="navitem">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/></svg>
    結帳
  </div>
</div>

<style>
  #__preview_nav {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 6px; box-sizing: border-box; z-index: 999999;
    pointer-events: none;
  }
  #__preview_nav button {
    pointer-events: auto;
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(26,26,26,0.35);
    background: rgba(253,252,249,0.55);
    color: rgba(26,26,26,0.55);
    font-size: 16px; font-family: sans-serif; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #__preview_nav button:active { background: rgba(26,26,26,0.15); }
  #__preview_nav .label {
    pointer-events: auto;
    font-size: 10px; font-family: sans-serif; color: rgba(26,26,26,0.45);
    background: rgba(253,252,249,0.55); border-radius: 8px;
    padding: 3px 8px; max-width: 55%; text-align: center;
  }
</style>
<div id="__preview_nav">
  <button onclick="window.pywebview && window.pywebview.api.go(-1)">‹</button>
  <div class="label">⑨ 導航尋物（9/13，點兩側圓鈕切換畫面）</div>
  <button onclick="window.pywebview && window.pywebview.api.go(1)">›</button>
</div>

</body>
</html>
